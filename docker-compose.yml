services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callanalytics
      POSTGRES_PASSWORD: c754616fb7dfd37f1d2d04a1407ba814
      POSTGRES_DB: callanalytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callanalytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend/app:/app/app
      - audio_data:/app/audio
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 2g
    mem_reservation: 1.5g
    restart: unless-stopped

  frontend:
    build:
      context: /opt/audira/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    name: call-analytics_pgdata
  audio_data:
    name: call-analytics_audio_data
  upload_data:
    name: call-analytics_upload_data

# 🔒 Явные имена volume — данные сохраняются при смене project name
# (переименование volume = риск потери данных, оставлены как были)
