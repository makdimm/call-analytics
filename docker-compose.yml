services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callanalytics
      POSTGRES_PASSWORD: c754616fb7dfd37f1d2d04a1407ba814
      POSTGRES_DB: callanalytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callanalytics"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: /opt/call-analytics/backend
    env_file: /opt/call-analytics/backend/.env
    mem_limit: 512m
    cpus: '1'
    volumes:
      - /opt/call-analytics/backend:/app
      - audio_data:/app/audio
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: /opt/call-analytics/frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  audio_data:
  upload_data:
